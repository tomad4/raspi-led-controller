<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131b" />
    <meta name="description" content="Sterowanie ramką LED i trybami oświetlenia." />
    <title>Ramka LED</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="title">
        <div class="eyebrow">STEROWANIE OŚWIETLENIEM</div>
        <h1 id="title">Ramka LED</h1>
        <p class="intro">Wybierz, jak ma świecić ramka.</p>

        <div class="modes" aria-label="Sterowanie i tryby podświetlenia">
          <button class="mode-button power-off" type="button" data-mode="toggle" aria-pressed="false">
            <span class="mode-number">0</span>
            <span class="mode-copy"><strong id="toggle-title">Wyłącz</strong><small id="toggle-copy">Zgaś ramkę</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
          <button class="mode-button" type="button" data-mode="hr" aria-pressed="false">
            <span class="mode-number">1</span>
            <span class="mode-copy"><strong>Tętno HR</strong><small>Kolor według tętna z pasa BLE</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
          <button class="mode-button" type="button" data-mode="power" aria-pressed="false">
            <span class="mode-number">2</span>
            <span class="mode-copy"><strong>Power</strong><small>Moc z trenażera lub miernika BLE</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
          <button class="mode-button" type="button" data-mode="demo" aria-pressed="false">
            <span class="mode-number">3</span>
            <span class="mode-copy"><strong>Demo</strong><small>Animacja kolorów</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
          <button class="mode-button" type="button" data-mode="night" aria-pressed="false">
            <span class="mode-number">4</span>
            <span class="mode-copy"><strong>Lampka nocna</strong><small>Stałe, przygaszone światło</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
          <button class="mode-button" type="button" data-mode="top_scan" aria-pressed="false">
            <span class="mode-number">5</span>
            <span class="mode-copy"><strong>Biegające światło</strong><small>Biały pasek na górnej krawędzi ramki</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
        </div>

        <p class="status" id="status" role="status" aria-live="polite">
          Łączenie ze sterownikiem…
        </p>
        <div class="hr-controls" id="hr-controls" hidden>
          <label for="hr-device">Urządzenie HR</label>
          <select id="hr-device">
            <option value="coospo">COOSPO H6</option>
          </select>
        </div>
        <div class="night-controls" id="night-controls" hidden>
          <label>Kolor <input id="night-color" type="color" value="#ff9650" /></label>
          <label>Jasność <input id="night-brightness" type="range" min="0.01" max="0.25" step="0.01" value="0.08" /></label>
        </div>
        <p class="note">Tryb Power wyszukuje automatycznie czujniki BLE Cycling Power i FTMS.</p>
        <section class="service-controls" aria-labelledby="service-title">
          <h2 id="service-title">Usługi systemowe</h2>
          <button class="service-button" id="restart-ssh" type="button">Restart SSH</button>
          <p class="service-status" id="service-status" role="status" aria-live="polite"></p>
        </section>
      </section>
      <footer>Raspberry Pi · 212 diod</footer>
    </main>
  </body>
</html>
