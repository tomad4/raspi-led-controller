<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131b" />
    <meta name="description" content="Lekki panel podglądu trybów ramki LED." />
    <title>Ramka LED</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="title">
        <div class="eyebrow">STEROWANIE OŚWIETLENIEM</div>
        <h1 id="title">Ramka LED</h1>
        <p class="intro">Wybierz tryb podświetlenia.</p>

        <div class="modes" aria-label="Tryby podświetlenia">
          <button class="mode-button" type="button" data-mode="1" aria-pressed="false">
            <span class="mode-number">01</span>
            <span class="mode-copy"><strong>Tryb 1</strong><small>Spokojne światło</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
          <button class="mode-button" type="button" data-mode="2" aria-pressed="false">
            <span class="mode-number">02</span>
            <span class="mode-copy"><strong>Tryb 2</strong><small>Kolorowa animacja</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
          <button class="mode-button" type="button" data-mode="3" aria-pressed="false">
            <span class="mode-number">03</span>
            <span class="mode-copy"><strong>Tryb 3</strong><small>Efekt dynamiczny</small></span>
            <span class="mode-indicator" aria-hidden="true"></span>
          </button>
        </div>

        <p class="status" id="status" role="status" aria-live="polite">
          Wybierz tryb, aby zobaczyć podgląd.
        </p>
        <p class="note">Podgląd lokalny — panel nie wysyła jeszcze poleceń do taśmy LED.</p>
      </section>
      <footer>Raspberry Pi · 212 diod</footer>
    </main>
  </body>
</html>
